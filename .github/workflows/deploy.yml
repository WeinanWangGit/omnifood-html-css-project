name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "07-Omnifood-Desktop/*"
          target: "/var/www/omnifood/"
          strip_components: 0
          overwrite: true
          command: |
            mkdir -p /var/www/omnifood
            chmod -R 755 /var/www/omnifood