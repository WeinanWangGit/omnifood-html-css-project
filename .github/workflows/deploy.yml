name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          # Find the project folder (07-Omnifood-Desktop)
          INDEX_DIR=$(ls -d 07-* 2>/dev/null | head -1)
          
          # Create tar and send to server via SSH
          tar czf - -C "./${INDEX_DIR}" . | ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key $USER@$HOST "
            mkdir -p /var/www/omnifood
            tar xzf - -C /var/www/omnifood
            echo 'Deploy completed'
          "
          
          echo "=== Deployment done ==="